name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ping Supabase database
        env:
          SECRET_SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          VAR_SUPABASE_DATABASE_URL: ${{ vars.SUPABASE_DATABASE_URL }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAR_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAR_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_DATABASE_URL="${SECRET_SUPABASE_DATABASE_URL:-$VAR_SUPABASE_DATABASE_URL}"
          SUPABASE_URL="${SECRET_SUPABASE_URL:-$VAR_SUPABASE_URL}"
          SUPABASE_ANON_KEY="${SECRET_SUPABASE_ANON_KEY:-$VAR_SUPABASE_ANON_KEY}"

          echo "DB URL secret present: ${{ secrets.SUPABASE_DATABASE_URL != '' }}"
          echo "DB URL variable present: ${{ vars.SUPABASE_DATABASE_URL != '' }}"
          echo "SUPABASE_URL secret present: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_URL variable present: ${{ vars.SUPABASE_URL != '' }}"
          echo "ANON key secret present: ${{ secrets.SUPABASE_ANON_KEY != '' }}"
          echo "ANON key variable present: ${{ vars.SUPABASE_ANON_KEY != '' }}"

          if [ -n "$SUPABASE_DATABASE_URL" ]; then
            psql "$SUPABASE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT now() AS keep_alive_ping;"
            exit 0
          fi

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            curl -sSf "${SUPABASE_URL}/rest/v1/users?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null
            echo "Keep-alive REST ping succeeded"
            exit 0
          fi

          echo "Missing credentials. Set SUPABASE_DATABASE_URL or set SUPABASE_URL and SUPABASE_ANON_KEY in GitHub Secrets/Variables."
          exit 1
